<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Заборона будь-яких мережевих запитів зі сторінки: дані не можуть бути нікуди відправлені -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="theme-color" content="#2155C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Навантаження школи</title>
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --raise:#F6F8FB; --sunk:#E9EDF3; --ink:#141A26; --ink2:#394253; --muted:#687386; --line:#DDE2EA; --line2:#C9D0DB;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E6EDFC; --accent-line:#B9CBF5;
  --ok:#127A50; --ok-soft:#DFF3E9; --warn:#9A5A00; --warn-soft:#FDF1DC; --warn-line:#E9BF74; --bad:#C0392B; --bad-soft:#FCE6E3;
  --side:#10182A; --side-ink:#E7ECF5; --side-muted:#8E9AB0; --side-hover:#1B2540; --side-active:#24315A;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
  --display:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1017; --surface:#151B26; --raise:#1A2130; --sunk:#10151E; --ink:#E6EAF2; --ink2:#C3CAD7; --muted:#8F9AAE; --line:#273042; --line2:#34405A;
    --accent:#7EA4FA; --accent-ink:#0A1224; --accent-soft:#1B2847; --accent-line:#34508F;
    --ok:#5ACB96; --ok-soft:#132E24; --warn:#EDAE4E; --warn-soft:#33260F; --warn-line:#7A5A22; --bad:#FF8173; --bad-soft:#3A1D1A;
    --side:#0A0E15; --side-hover:#141B28; --side-active:#1B2640;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1017; --surface:#151B26; --raise:#1A2130; --sunk:#10151E; --ink:#E6EAF2; --ink2:#C3CAD7; --muted:#8F9AAE; --line:#273042; --line2:#34405A;
  --accent:#7EA4FA; --accent-ink:#0A1224; --accent-soft:#1B2847; --accent-line:#34508F;
  --ok:#5ACB96; --ok-soft:#132E24; --warn:#EDAE4E; --warn-soft:#33260F; --warn-line:#7A5A22; --bad:#FF8173; --bad-soft:#3A1D1A;
  --side:#0A0E15; --side-hover:#141B28; --side-active:#1B2640;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.005em}
p{margin:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.logo svg.i{width:23px;height:23px;stroke:#fff}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.brand-t{min-width:0;display:flex;flex-direction:column;gap:1px}
.brand-t b{font:600 18px/1.15 var(--display);color:#fff}
.brand-t span{font-size:11.5px;line-height:1.3;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-t #schoolLbl{color:#C2CCDE}
.brand-t span:empty{display:none}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-muted);font-weight:600;padding:14px 10px 6px}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-ink);text-align:left;padding:9px 10px;border-radius:10px;position:relative}
.nav:hover{background:var(--side-hover)}
.nav[aria-current="page"]{background:var(--side-active)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#7EA4FA}
.nav-i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font:600 14px/1 var(--display);border:1.5px solid #3A4661;color:var(--side-muted)}
.nav.plain .nav-i{border:0}
.nav.ok .nav-i{background:#1D7A52;border-color:#1D7A52;color:#fff}
.nav.warn .nav-i{border-color:#E0A340;color:#F2BD66}
.nav[aria-current="page"] .nav-i{border-color:#7EA4FA;color:#fff}
.nav.ok[aria-current="page"] .nav-i{border-color:#1D7A52}
.nav-i svg.i{width:16px;height:16px}
.nav-t{display:flex;flex-direction:column;min-width:0}
.nav-t b{font-weight:600;font-size:14.5px}
.nav-t small{font-size:12px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.warn .nav-t small{color:#F2BD66}
.nav.ok .nav-t small{color:#7FD3A9}
.side-foot{margin-top:auto;padding:14px 10px 2px;font-size:12.5px;color:var(--side-muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3FBF84;margin-right:7px;vertical-align:1px}
.side-foot .dot.bad{background:#FF6F61}
.side-foot .btn{align-self:flex-start}

.content{min-width:0;padding:28px 36px 48px}
#banner,#view{max-width:1180px;margin:0 auto}
#banner{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
#view{display:flex;flex-direction:column;gap:16px}

/* ---------- заголовок сторінки ---------- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-bottom:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.phead h1{font-size:32px;line-height:1.1}
.lead{color:var(--ink2);max-width:700px;margin-top:6px;font-size:15px}
.pactions{display:flex;gap:8px;flex-wrap:wrap}
.pfoot{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:18px;border-top:1px solid var(--line)}
.pfoot .btn{min-height:42px}

/* ---------- картки, кнопки, поля ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.card > header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > header h2{font-size:20px}
.card > header h3{font-size:17px}
.card > header .sp{flex:1}
.card .sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{min-height:31px;padding:0 11px;font-size:13px;border-radius:8px}
.btn svg.i{width:17px;height:17px}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;padding:0}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.x:disabled{opacity:.3;pointer-events:none}
.x.plain:hover{background:var(--sunk);color:var(--ink)}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.field input,.field select,.field textarea{color:var(--ink);font-weight:400;font-size:14.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 160px}
.row > .field.s{flex:0 0 110px}
.hint{font-size:13px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill svg.i{width:14px;height:14px}

.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.notice.ok{background:var(--ok-soft);border-color:transparent}
.notice > svg.i{width:20px;height:20px}
.notice.warn > svg.i{color:var(--warn)}
.notice.ok > svg.i{color:var(--ok)}
.notice .grow{flex:1 1 280px}

details.more{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
details.more > summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;display:flex;align-items:center;gap:10px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
details.more[open] > summary::after{transform:rotate(-135deg)}
details.more > summary small{font-weight:400;color:var(--muted)}
details.more > summary svg.i{color:var(--accent)}
details.more > .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}

.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.14)}

/* ---------- таблиці ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;background:var(--surface)}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:middle}
.tbl tbody tr:last-child > *{border-bottom:0}
.tbl thead th{background:var(--raise);font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl input,.tbl select{min-height:34px}
.tbl tbody tr:hover > td{background:var(--raise)}
.tbl .grouprow th{background:var(--sunk);font:600 16px/1.2 var(--display);text-transform:none;letter-spacing:0;color:var(--ink);padding:10px 12px}
.tbl .grouprow th span{font:400 13px var(--body);color:var(--muted);margin-left:10px}
.tbl tr.unassigned > td{background:var(--warn-soft)}
.tbl tr.unassigned > td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tbl tr.unassigned:hover > td{background:var(--warn-soft)}
.cellname{font-weight:600}
.cellsub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

/* ---------- навчальний план ---------- */
.toolbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:24px;height:18px;border-radius:5px;border:1.5px solid var(--line2);background:var(--surface)}
.sw.est{border:1.5px dashed var(--warn);background:var(--warn-soft)}
.sw.est1{border:1.5px dashed var(--muted);background:var(--raise)}
.sw.grp{width:auto;height:auto;border-radius:99px;font-size:11px;font-weight:600;padding:1px 7px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)}
.gridwrap{overflow:auto;max-height:calc(100vh - 260px);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;background:var(--surface);min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--raise);padding:9px 8px;font:600 16px/1.2 var(--display);white-space:nowrap}
.grid thead th small{display:block;font:400 11.5px/1.3 var(--body);color:var(--muted)}
.grid .subj{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:230px;padding:8px 14px;font-weight:600;font-size:14px}
.grid .subj small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.grid thead th.subj{z-index:3;background:var(--raise);font:600 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);vertical-align:bottom}
.grid td.pc{min-width:96px;padding:7px 8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.cell input{width:60px;min-height:34px;text-align:center;padding:4px;border:1.5px solid transparent;background:var(--sunk);border-radius:8px;font-weight:600;font-size:15px;-moz-appearance:textfield;box-shadow:none}
.cell input::-webkit-outer-spin-button,.cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell input:hover{border-color:var(--line2)}
.cell input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.cell input:not(:placeholder-shown){background:var(--surface);border-color:var(--line2)}
.cell.est2 input,.cell.est2 input:not(:placeholder-shown){border:1.5px dashed var(--warn);background:var(--warn-soft)}
.cell.est1 input,.cell.est1 input:not(:placeholder-shown){border:1.5px dashed var(--muted);background:var(--raise)}
.cell.est2 input::placeholder{color:var(--warn);font-size:12.5px;font-weight:600}
.okbtn{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line2);background:var(--surface);border-radius:99px;font-size:11.5px;font-weight:600;line-height:1;padding:3px 9px 3px 6px;color:var(--ink2)}
.okbtn svg.i{width:12px;height:12px;stroke-width:2.6;color:var(--ok)}
.okbtn:hover{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pdiff{font-size:11.5px;font-weight:600;color:var(--warn);white-space:nowrap}
.pdiff.ok{color:var(--muted);font-weight:500}
.pdone{height:20px;display:grid;place-items:center;color:var(--ok)}
.pdone svg.i{width:14px;height:14px;stroke-width:2.6}
.howcheck .howto{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grp{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:11.5px;line-height:1;padding:3px 8px;color:var(--muted);font-weight:600}
.grp:hover{border-color:var(--muted)}
.grp.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.grp.man{box-shadow:0 0 0 1.5px var(--accent) inset}
.grid tbody tr:hover > *{background:var(--raise)}
.grid tfoot th,.grid tfoot td{position:sticky;background:var(--raise);font-weight:700;font-variant-numeric:tabular-nums;padding:9px 8px;font-size:14px}
.grid tfoot tr:nth-child(1) > *{bottom:40px}
.grid tfoot tr:nth-child(2) > *{bottom:0}
.grid tfoot .subj{font-weight:600;z-index:3}
.grid td.tot{font-weight:700;font-variant-numeric:tabular-nums;padding:0 14px;background:var(--raise)}

/* ---------- класи: завантаження ---------- */
.drop{border:2px dashed var(--line2);border-radius:14px;padding:30px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop > svg.i{width:42px;height:42px;color:var(--accent);stroke-width:1.5}
.drop b{font:600 21px/1.2 var(--display)}
.drop > div > span{color:var(--muted)}
.drop.compact{flex-direction:row;padding:14px 18px;text-align:left;gap:14px}
.drop.compact > svg.i{width:28px;height:28px}
.drop.compact b{font-size:16px}
.drop.compact > div > span{display:block;font-size:13px}
body.dragging .drop{border-color:var(--accent);background:var(--accent-soft)}
body.dragging::after{content:"Відпустіть файли, щоб завантажити";position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(36,87,214,.16);font:600 28px var(--display);color:var(--accent);pointer-events:none}
.howto{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;counter-reset:h;width:100%;text-align:left}
.howto li{counter-increment:h;display:flex;gap:10px;align-items:flex-start;background:var(--raise);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}
.howto li::before{content:counter(h);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:600 12px/22px var(--display);text-align:center}

.report{display:flex;flex-direction:column}
.ir{display:grid;grid-template-columns:70px minmax(140px,230px) 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ir:last-child{border-bottom:0}
.ir-c{font:600 18px/1 var(--display)}
.ir-s{font-weight:600}
.ir-f{display:flex;flex-wrap:wrap;gap:6px}
.ir.err{grid-template-columns:1fr;color:var(--bad)}

/* ---------- старт ---------- */
.timeline{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:44px 1fr auto 20px;gap:16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow);width:100%;color:var(--ink)}
.tl:hover{border-color:var(--accent-line);background:var(--raise)}
.tl > svg.i{color:var(--muted)}
.tl-n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 18px/1 var(--display);background:var(--sunk);color:var(--muted)}
.tl.ok .tl-n{background:var(--ok);color:#fff}
.tl.warn .tl-n{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.tl-b b{display:block;font:600 18px/1.2 var(--display)}
.tl-b span{color:var(--muted);font-size:14px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.split > .stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fact{background:var(--raise);border-radius:12px;padding:14px 16px}
.fact b{display:block;font:600 21px/1.15 var(--display);margin-bottom:4px}
.fact span{color:var(--muted);font-size:13.5px}
.mock{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--raise);display:flex;flex-direction:column;gap:10px;min-width:250px}
.mock-t{font:600 17px/1 var(--display);margin-bottom:2px}
.mock label{display:flex;align-items:center;gap:9px;font-size:14px}
.mock label i{width:18px;height:18px;border-radius:5px;background:var(--accent);display:grid;place-items:center;flex:none}
.mock label i svg.i{width:13px;height:13px;stroke:#fff;stroke-width:2.6}
.mock label small{color:var(--muted)}
.mriya{display:flex;gap:20px;flex-wrap:wrap;align-items:stretch}
.mriya .howto{flex:1 1 340px;grid-template-columns:1fr}

/* ---------- навантаження ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.tile b{font:600 34px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.meter{position:relative;height:8px;border-radius:99px;background:var(--sunk);min-width:90px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter i.ok{background:var(--ok)} .meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);opacity:.5;border-radius:2px}
.loadcell{display:flex;flex-direction:column;gap:6px;min-width:140px}
.loadcell b{font-variant-numeric:tabular-nums}
.teach{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:3px 0}
.teach > b{font-weight:600;margin-right:4px}
.chip{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700;color:var(--ink)}
.bigprog{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}
.bigprog .val{font:600 28px/1 var(--display);white-space:nowrap}
.bigprog .val small{font:400 14px var(--body);color:var(--muted);margin-left:6px}
.bigprog .bar{flex:1 1 220px;height:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips label{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600}
.chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px}
.empty > svg.i{width:44px;height:44px;color:var(--muted);stroke-width:1.4}
.empty b{font:600 21px var(--display)}
.empty p{color:var(--muted);max-width:480px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:600;z-index:100;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1100px){ .split{grid-template-columns:1fr} }
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:2px}
  .brand{padding:0 8px 0 2px}
  .brand-t,.nav-h,.nav-sep,.side-foot,.nav-t small{display:none}
  #steps{display:flex;gap:2px}
  .nav{width:auto;padding:7px 9px;gap:8px}
  .nav[aria-current="page"]::before{display:none}
  .nav-t b{font-size:13.5px;white-space:nowrap}
  .content{padding:18px 16px 40px}
  .phead h1{font-size:26px}
  .ir{grid-template-columns:64px 1fr}
  .ir-f{grid-column:1 / -1}
  .tl{grid-template-columns:40px 1fr}
  .tl > .pill,.tl > svg.i{display:none}
}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .side,.noprint,#banner,#toast,.pfoot,.pactions{display:none!important}
  .app{display:block}
  .content{padding:0}
  .card,.tile{border:0;box-shadow:none;padding:0}
  .tblwrap{overflow:visible;border:0}
  .tbl th,.tbl td{border:1px solid #999;padding:4px 6px}
  .meter{display:none}
}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo"><img id="logoImg" src="logo.gif" alt=""><svg class="i" viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg></span>
      <div class="brand-t"><b>Навантаження</b><span id="schoolLbl"></span><span id="yearLbl"></span></div>
    </div>
    <nav id="steps" aria-label="Кроки"></nav>
    <div class="side-foot" id="saveState"></div>
  </aside>
  <div class="content">
    <div id="banner" hidden></div>
    <main id="view"></main>
  </div>
</div>
<div id="toast" role="status"></div>
<input type="file" id="fileXlsx" multiple accept=".xlsx,.zip" hidden>
<input type="file" id="fileJson" accept=".json" hidden>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const byId = (arr, id) => arr.find(x => x.id === id);
const fmt = n => String(Math.round((+n || 0) * 100) / 100).replace('.', ',');
const fmtZ = n => n ? fmt(n) : '';
const hm = t => new Date(t).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
const today = () => new Date().toISOString().slice(0, 10);

/* окремі ключі — не перетинаються з журналом ФК */
const LS = 'shkola-navantazhennya-v1';

/* split: 0 — без поділу, 1 — ділиться при наповнюваності ≥ порогу, 2 — ділиться лише в 10–11 класах */
const SUBJECTS = [
  ['Українська мова', 0], ['Українська література', 0], ['Зарубіжна література', 0],
  ['Англійська мова', 1], ['Друга іноземна мова', 1],
  ['Математика', 0], ['Алгебра', 0], ['Геометрія', 0],
  ['Історія України', 0], ['Всесвітня історія', 0], ['Громадянська освіта', 0], ['Географія', 0],
  ['Пізнаємо природу', 0], ['Біологія', 0], ['Фізика', 0], ['Хімія', 0],
  ['Інформатика', 1], ['Технології', 1], ['Мистецтво', 0],
  ['Здоров’я, безпека та добробут', 0], ['Фізична культура', 2], ['Захист України', 0]
];
const SPLIT = ['Без поділу', 'Ділиться (≥ поріг учнів)', 'Ділиться лише в 10–11 кл.'];

function guessYear() { const d = new Date(), y = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; return y + '/' + (y + 1); }
function blank() {
  return { v: 1, school: '', year: guessYear(), stavka: 18, splitMin: 27, classes: [],
    subjects: SUBJECTS.map(([name, split]) => ({ id: uid(), name, split })),
    teachers: [], plan: {}, assign: {}, extras: [], updated: 0 };
}
function valid(d) { return d && d.v === 1 && Array.isArray(d.classes) && Array.isArray(d.subjects) && Array.isArray(d.teachers); }

let S = blank();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- база даних (IndexedDB) + автоматичні копії ---------- */
const DB_NAME = 'navantazhennya-db', KEEP_SNAPS = 60;
let dbp, saveT, savedAt = 0, saveErr = '';
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('snaps', { keyPath: 'id', autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode), r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = key => tx('kv', 'readonly', st => st.get(key));
const kvPut = (key, val) => tx('kv', 'readwrite', st => st.put(val, key));
const kvDel = key => tx('kv', 'readwrite', st => st.delete(key));

function save() {
  S.updated = Date.now();
  clearTimeout(saveT); saveT = setTimeout(flush, 300);
}
async function flush() {
  clearTimeout(saveT);
  try { await kvPut('data', S); savedAt = Date.now(); saveErr = ''; }
  catch (e) { saveErr = 'Не вдалося зберегти!'; }
  showSave(); folderSave();
}
const summary = d => `${d.classes.length} кл., ${d.teachers.length} вчит., ${Object.keys(d.assign).length} призначень`;
async function snapshot(reason) {
  if (!S.classes.length && !S.teachers.length) return;
  await tx('snaps', 'readwrite', st => st.add({ at: Date.now(), reason, info: summary(S), data: JSON.parse(JSON.stringify(S)) }));
  const all = await listSnaps();
  if (all.length > KEEP_SNAPS) await tx('snaps', 'readwrite', st => all.slice(KEEP_SNAPS).forEach(s => st.delete(s.id)));
}
async function listSnaps() {
  const all = await tx('snaps', 'readonly', st => st.getAll());
  return all.sort((a, b) => b.at - a.at);
}

/* копії в папку на диску (Chrome / Edge) */
const canDir = 'showDirectoryPicker' in window;
let DIR = null, dirOk = false, dirAt = 0, dirT;
function folderSave() { clearTimeout(dirT); dirT = setTimeout(writeFolder, 2000); }
async function writeFolder() {
  if (!DIR || !dirOk || (!S.classes.length && !S.teachers.length)) return;
  try {
    const put = async (dir, name) => { const w = await (await dir.getFileHandle(name, { create: true })).createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close(); };
    await put(DIR, 'Навантаження — поточні дані.json');
    const sub = await DIR.getDirectoryHandle('Копії по днях', { create: true });
    await put(sub, `Навантаження ${today()}.json`);
    dirAt = Date.now();
  } catch (e) { dirOk = false; }
  showSave();
}
function showSave() {
  const el = $('#saveState'); if (!el) return;
  let h = saveErr ? `<span><i class="dot bad"></i>${saveErr}</span>` : `<span><i class="dot"></i>Збережено${savedAt ? ' о ' + hm(savedAt) : ''}</span>`;
  if (DIR && dirOk) h += `<span>Копія в папці «${esc(DIR.name)}»${dirAt ? ' о ' + hm(dirAt) : ''}</span>`;
  else if (DIR) h += `<button class="btn small warn" data-act="reconnectDir">Дозволити копії в папку</button>`;
  else if (canDir) h += `<span>Папку для копій не вибрано</span>`;
  el.innerHTML = h;
  showBanner();
}
async function takeData(d, from) {
  if (!valid(d)) { toast('Це не файл програми «Навантаження»'); return false; }
  await snapshot('перед відновленням');
  S = d; await flush();
  toast('Відновлено: ' + from); return true;
}

/* ---------- класи, предмети, години ---------- */
const LAT = { A: 'А', B: 'В', C: 'С', E: 'Е', H: 'Н', I: 'І', K: 'К', M: 'М', O: 'О', P: 'Р', T: 'Т', X: 'Х' };
function normClass(v) {
  let s = String(v || '').trim().toUpperCase().replace(/\s+/g, '').replace(/[ABCEHIKMOPTX]/g, c => LAT[c]);
  const m = s.match(/^(\d{1,2})[-–—.]?([А-ЯҐЄІЇ])(?:КЛАС|КЛ\.?)?$/);
  return m ? m[1] + '-' + m[2] : s.replace(/КЛАС$/, '');
}
const gradeOf = n => parseInt(n, 10) || 0;
const cls = () => [...S.classes].sort((a, b) => gradeOf(a.name) - gradeOf(b.name) || a.name.localeCompare(b.name, 'uk'));
const teachersSorted = () => [...S.teachers].sort((a, b) => a.name.localeCompare(b.name, 'uk'));
const cellOf = (c, s) => S.plan[c.id + '|' + s.id];
const hoursOf = (c, s) => +(cellOf(c, s)?.h) || 0;
function autoGroups(c, s) {
  if (!s.split || (s.split === 2 && gradeOf(c.name) < 10)) return 1;
  return (c.students || 0) >= S.splitMin ? 2 : 1;
}
const groupsOf = (c, s) => cellOf(c, s)?.g || autoGroups(c, s);

/* одиниця навантаження = клас × предмет × група */
function units() {
  const out = [];
  for (const c of cls()) for (const s of S.subjects) {
    const h = hoursOf(c, s); if (!h) continue;
    const g = groupsOf(c, s);
    for (let i = 0; i < g; i++) {
      const key = c.id + '|' + s.id + '|' + i, t = S.assign[key];
      out.push({ c, s, i, g, h, key, t: byId(S.teachers, t) ? t : '' });
    }
  }
  return out;
}
function loads() {
  const m = new Map(teachersSorted().map(t => [t.id, { t, rows: [], extra: [], total: 0 }]));
  for (const u of units()) { const L = m.get(u.t); if (L) { L.rows.push(u); L.total += u.h; } }
  for (const e of S.extras) { const L = m.get(e.teacherId); if (L) { L.extra.push(e); L.total += +e.h || 0; } }
  return [...m.values()];
}
function bySubject(L) {
  const m = new Map();
  for (const u of L.rows) {
    if (!m.has(u.s.id)) m.set(u.s.id, { s: u.s, parts: [], h: 0 });
    const x = m.get(u.s.id);
    x.parts.push({ u, label: u.c.name + (u.g > 1 ? ' гр.' + (u.i + 1) : '') });
    x.h += u.h;
  }
  return [...m.values()];
}
function status(total) {
  const st = S.stavka;
  if (!total) return ['без годин', ''];
  if (total < st) return ['менше ставки', 'warn'];
  if (total === st) return ['ставка', 'ok'];
  return ['понад ставку', 'bad'];
}
function guessSplit(name) {
  if (/англ|німец|франц|іспан|польськ|іноземн|інформат|технолог|трудов/i.test(name)) return 1;
  if (/фізичн.*культ/i.test(name)) return 2;
  return 0;
}
const normSubj = s => String(s).toLowerCase().replace(/[’'`ʼ]/g, '').replace(/\s+/g, ' ').trim();
function findSubject(name) {
  const n = normSubj(name);
  return S.subjects.find(s => normSubj(s.name) === n) || S.subjects.find(s => { const x = normSubj(s.name); return x.includes(n) || n.includes(x); });
}

/* ---------- читання .xlsx з Мрії (без інтернету) ---------- */
function unzip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('файл пошкоджений або це не .xlsx');
  const n = dv.getUint16(e + 10, true), files = {};
  let p = dv.getUint32(e + 16, true);
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    files[name] = { method, data: u8.subarray(start, start + size) };
    p += 46 + nl + xl + cl;
  }
  const raw = async name => {
    const f = files[name]; if (!f) return null;
    if (f.method === 0) return f.data.slice().buffer;
    if (typeof DecompressionStream === 'undefined') throw new Error('оновіть браузер (Chrome або Edge)');
    return new Response(new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  };
  return { names: Object.keys(files), has: n => n in files, bytes: raw, text: async n => { const b = await raw(n); return b ? td.decode(b) : null; } };
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const tags = (el, t) => [...el.getElementsByTagNameNS('*', t)];
function colIdx(letters) { let n = 0; for (const ch of letters) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }
function sheetRows(xml, shared) {
  const rows = [];
  for (const r of tags(xmlDoc(xml), 'row')) {
    const arr = [];
    for (const c of tags(r, 'c')) {
      const col = colIdx((c.getAttribute('r') || '').replace(/\d+/g, '')) ;
      const vEl = tags(c, 'v')[0];
      const v = c.getAttribute('t') === 's' ? shared[+(vEl?.textContent)] || '' : tags(c, 't').map(x => x.textContent).join('') || vEl?.textContent || '';
      arr[col >= 0 ? col : arr.length] = v.trim();
    }
    rows.push(arr);
  }
  return rows;
}
async function readMriya(z, fname) {
  const shared = [], ss = await z.text('xl/sharedStrings.xml');
  if (ss) for (const si of tags(xmlDoc(ss), 'si')) shared.push(tags(si, 't').map(t => t.textContent).join(''));
  const base = fname.replace(/\.xlsx$/i, '').replace(/\s*\(\d+\)\s*$/, '');
  const m = base.match(/^\s*(\d{1,2}\s*[-–—]?\s*[A-Za-zА-ЯҐЄІЇа-яґєії])\s*[,_]\s*(.+?)\s*$/);
  let cls = m ? normClass(m[1]) : '', subj = m ? m[2] : '', group = 0;
  /* «Англійська мова (група 2)», «Англійська мова, 2 підгрупа», «Інформатика гр. 1» → предмет + номер групи */
  const gm = subj.match(/\s*[(,\-–]?\s*(?:(?:під)?груп[аи]?|гр\.?)\s*№?\s*(\d)\s*\)?\s*$/i) || subj.match(/\s*[(,\-–]?\s*(\d)\s*[-–]?\s*(?:(?:під)?груп[аи]?|гр\.?)\s*\)?\s*$/i);
  if (gm) { group = +gm[1]; subj = subj.slice(0, gm.index).trim(); }
  let students = [], teacher = '';
  const dates = new Set();
  for (const sn of z.names.filter(n => /^xl\/worksheets\/[^/]+\.xml$/i.test(n)).sort()) {
    const rows = sheetRows(await z.text(sn), shared);
    const hdr = rows.findIndex(r => r.some(v => /прізвище/i.test(v || '')));
    for (const r of rows) for (const v of r) {
      const d = (v || '').match(/^(\d{1,2})\s*[\/.]\s*(\d{1,2})$/);
      if (d && +d[2] >= 1 && +d[2] <= 12 && +d[1] >= 1 && +d[1] <= 31) dates.add(+d[1] + '/' + +d[2]);
      if (!cls) { const k = (v || '').match(/(\d{1,2}\s*-\s*[А-ЯҐЄІЇ])\s*клас/i); if (k) cls = normClass(k[1]); }
      /* аркуш «Планування»: «Вчитель Прізвище Ім'я По батькові» */
      if (!teacher) { const t = (v || '').match(/^вчител(?:ь|ька)[:\s]+([А-ЯҐЄІЇ][^\d]{3,})$/i); if (t) teacher = t[1].replace(/\s+/g, ' ').trim(); }
    }
    if (hdr >= 0 && !students.length) {
      const nameCol = rows[hdr].findIndex(v => /прізвище/i.test(v || ''));
      students = rows.slice(hdr + 1).filter(r => /^\d+$/.test(r[0] || '') && /[а-яіїєґ]/i.test(r[nameCol] || '')).map(r => r[nameCol]);
    }
  }
  return { file: fname, cls, subj, group, students, teacher, dates: [...dates] };
}
/* Години на тиждень за датами уроків. stable = усі повні тижні дали однакову кількість
   (перший і поточний тиждень можуть бути неповними — їх не рахуємо, якщо там менше уроків). */
function estInfo(dates) {
  const y0 = parseInt(S.year, 10) || new Date().getFullYear();
  const now = new Date(); now.setHours(0, 0, 0, 0); now.setDate(now.getDate() - (now.getDay() + 6) % 7);
  const weeks = dates.map(x => {
    const [dd, mm] = x.split('/').map(Number), dt = new Date(mm >= 8 ? y0 : y0 + 1, mm - 1, dd);
    dt.setDate(dt.getDate() - (dt.getDay() + 6) % 7);
    return dt;
  });
  const past = weeks.filter(dt => dt <= now), wk = new Map();
  for (const dt of past.length ? past : weeks) wk.set(+dt, (wk.get(+dt) || 0) + 1);
  if (!wk.size) return null;

/* Групи предмета в класі за журналами: різні діти → різні групи; ті самі діти → одна група (заміна / спільне ведення) */

  const shared = units.some(u => new Set(u.js.map(j => j.t).filter(Boolean)).size > 1);
  /* журнали — джерело правди: скільки різних списків дітей, стільки й груп (поріг учнів тут не діє) */
  if (units.length !== autoGroups(c, s)) { p.g = units.length; p.gi = true; }

}

function applyImport(info, res) {
  if (!info.cls) {
    const ans = prompt(`Не вдалося визначити клас у файлі «${info.file}». Вкажіть клас (напр. 7-А):`);
    if (!ans) { res.push({ file: info.file, err: 'пропущено — клас не вказано' }); return; }
    info.cls = normClass(ans);
  }
  if (!S.salt) S.salt = uid() + uid() + uid();
  let c = S.classes.find(x => x.name === info.cls);
  const isNew = !c;
  if (!c) { c = { id: uid(), name: info.cls, students: null }; S.classes.push(c); }
  c.src = 'Мрія';
  let s = null, est = null, planSet = false, t = null;
  if (info.subj) {
    s = findSubject(info.subj);
    if (!s) { s = { id: uid(), name: info.subj, split: guessSplit(info.subj) }; S.subjects.push(s); }
    const ei = estInfo(info.dates);
    est = ei?.h ?? null;
    const k = c.id + '|' + s.id;
    if (est && !S.plan[k]?.h) { S.plan[k] = { ...S.plan[k], h: est, est: ei.stable ? 1 : 2 }; planSet = true; }
  }
  if (info.teacher) {
    /* «Рябець Олександр» і «Рябець Олександр Андрійович» — одна людина */
    const words = n => n.toLowerCase().split(/\s+/);
    const same = (a, b) => { const x = words(a), y = words(b), n = Math.min(x.length, y.length, 2); return n >= 2 && x.slice(0, n).join(' ') === y.slice(0, n).join(' '); };
    t = S.teachers.find(x => same(x.name, info.teacher));
    if (!t) { t = { id: uid(), name: info.teacher, note: '' }; S.teachers.push(t); }
    else if (info.teacher.length > t.name.length) t.name = info.teacher;
  }
  let out = {};
  const r = info.students.map(rosterCode);
  if (s && r.length) {
    c.journals = c.journals || {};
    /* той самий вчитель може вести дві групи одного предмета — тоді два журнали з різними дітьми */
    const k0 = s.id + '|' + (t?.id || '') + '|' + (info.group || 0), set = codeSet(r);
    let key = k0;
    for (let n = 2; c.journals[key] && !info.group && !sameKids(codeSet(c.journals[key].r), set); n++) key = k0 + '#' + n;
    c.journals[key] = { s: s.id, t: t?.id || '', g: info.group || 0, r, at: Date.now() + res.length };

    c.boys = r.filter(x => x.endsWith('m')).length;
    c.girls = r.filter(x => x.endsWith('f')).length;
  }
  res.push({ file: info.file, cls: c.name, isNew, students: r.length, classCount: c.students, boys: c.boys, girls: c.girls,
    subj: s?.name, est, planSet, teacher: t?.name, group: info.group, groups: out.groups || 0, shared: out.shared, cid: c.id, sid: s?.id });
}

async function importBuffer(buf, name, res) {
  const z = unzip(buf);

    const inner = z.names.filter(n => /\.xlsx$/i.test(n));
    if (!inner.length) throw new Error('це не файл Excel (.xlsx)');
    for (const n of inner) await importBuffer(await z.bytes(n), n.split('/').pop(), res);

  const json = files.find(f => /\.json$/i.test(f.name));
  if (json) return openJsonFile(json);
  await snapshot('перед імпортом з Мрії');
  const res = [];
  for (const f of files) {
    try { await importBuffer(await f.arrayBuffer(), f.name, res); }
    catch (e) { res.push({ file: f.name, err: e.message || String(e) }); }

}

function progress() {
  const U = units(), all = U.reduce((a, u) => a + u.h, 0), freeH = U.filter(u => !u.t).reduce((a, u) => a + u.h, 0);
  const cIds = new Set(S.classes.map(c => c.id)), sIds = new Set(S.subjects.map(s => s.id));
  let est = 0, warn = 0;
  for (const [k, p] of Object.entries(S.plan)) {
    const [ci, si] = k.split('|');
    if (!p.est || !p.h || !cIds.has(ci) || !sIds.has(si)) continue;
    est++; if (estLevel(byId(S.classes, ci), byId(S.subjects, si)) === 2) warn++;
  }
  const P = S.subjects.filter(s => S.classes.some(c => hoursOf(c, s))).length;
  return { C: S.classes.length, T: S.teachers.length, P, est, warn, all, freeH, U };
}

function importReport() {
  if (!lastImport) return '';
  const ok = lastImport.filter(r => !r.err).length;
  const rows = lastImport.map((r, i) => {
    if (r.err) return `<div class="ir err">${ic('alert')} ${esc(r.file)} — ${esc(r.err)}</div>`;
    const lastOfPair = r.sid && !lastImport.slice(i + 1).some(x => x.cid === r.cid && x.sid === r.sid);
    const c = byId(S.classes, r.cid), s = byId(S.subjects, r.sid), f = [];
    if (r.students) f.push(`<span class="pill">${r.students} ${plural(r.students, 'учень', 'учні', 'учнів')}${r.classCount !== r.students ? ` · у класі ${r.classCount}` : ''}</span>`);
    else f.push('<span class="pill warn">учнів не знайдено</span>');
    if (r.est) f.push(`<span class="pill${r.planSet ? ' warn' : ''}">~${r.est} год/тиж${r.planSet ? ' → у план, перевірте' : ''}</span>`);
    f.push(r.teacher ? `<span class="pill ok">${ic('teacher')} ${esc(shortName(r.teacher))}${r.group ? `, група ${r.group}` : ''}</span>` : '<span class="pill warn">без вчителя — потрібна галочка «Планування»</span>');
    if (lastOfPair && c && s && r.groups > 1) f.push(`<span class="pill blue">${r.groups} групи за списками учнів</span>`);
    if (lastOfPair && r.shared) f.push('<span class="pill warn">ті самі учні у двох вчителів — заміна? перевірте</span>');
    return `<div class="ir"><span class="ir-c">${esc(r.cls)}</span><span class="ir-s">${esc(r.subj || '—')}${r.isNew ? ' <span class="pill blue">новий клас</span>' : ''}</span><span class="ir-f">${f.join('')}</span></div>`;
  }).join('');
  return `<section class="card"><header>${ic('check')}<h3>Завантажено ${ok} з ${lastImport.length} ${plural(lastImport.length, 'файлу', 'файлів', 'файлів')}</h3><span class="sp"></span><button class="x plain" data-act="closeImport" title="Сховати">${ic('x')}</button></header><div class="report">${rows}</div></section>`;
}

let planMode = 'grade', planWarnOnly = false;
V.plan = () => {
  const C = cls();
  if (!C.length) return pageHead('Навчальний план', '') + emptyState('plan', 'Спершу потрібні класи', 'Завантажте журнали з Мрії або додайте класи вручну — тоді тут з’явиться таблиця годин.', 'classes', 'До класів');
  const p0 = progress();
  const grades = [...new Set(C.map(c => gradeOf(c.name)))].sort((a, b) => a - b);
  const inGrade = g => C.filter(c => gradeOf(c.name) === g);
  const used = S.subjects.filter(s => C.some(c => hoursOf(c, s)));
  const rowWarn = s => C.some(c => estLevel(c, s) === 2);
  let subs = planAll || !used.length ? S.subjects : used;
  if (planWarnOnly) subs = subs.filter(rowWarn);
  const lvlCls = l => l === 2 ? ' est2' : l === 1 ? ' est1' : '';

  /* клітинка «клас × предмет» */
  const cell = (c, s) => {
    const p = cellOf(c, s), g = groupsOf(c, s), l = estLevel(c, s);
    const why = l === 2 ? (p.est === 2 ? 'У журналі тижні мають різну кількість уроків — перевірте' : 'Інші класи паралелі мають іншу кількість годин — перевірте') : l === 1 ? 'Взято з журналу: кожен тиждень однаково' : '';
    return `<td class="pc"><div class="cell${lvlCls(l)}"${why ? ` title="${why}"` : ''}><input type="number" min="0" max="40" step="0.5" placeholder=" " data-plan="${c.id}|${s.id}" value="${p?.h || ''}" aria-label="${esc(s.name)}, ${esc(c.name)}"><button class="grp${g > 1 ? ' on' : ''}${p?.g ? ' man' : ''}" data-act="cycleG" data-k="${c.id}|${s.id}" title="Груп: ${g} (${p?.g ? 'задано вручну' : 'автоматично'}). Натисніть, щоб змінити" style="visibility:${p?.h ? 'visible' : 'hidden'}">${g > 1 ? g + ' групи' : 'весь клас'}</button></div></td>`;
  };
  /* клітинка «паралель × предмет» */
  const pcell = (g, s) => {
    const G = inGrade(g), vals = G.map(c => hoursOf(c, s)), set = [...new Set(vals.filter(Boolean))];
    const differ = set.length > 1 || (set.length === 1 && vals.some(v => !v));
    const lvl = Math.max(0, ...G.map(c => estLevel(c, s))), anyEst = G.some(c => cellOf(c, s)?.est && hoursOf(c, s));
    const detail = differ ? G.map(c => `${esc(c.name.split('-')[1] || c.name)}${hoursOf(c, s) ? fmt(hoursOf(c, s)) : '—'}`).join(' · ') : '';
    const cl = differ && anyEst ? ' est2' : lvlCls(lvl);
    return `<td class="pc"><div class="cell${cl}"${differ ? ' title="Класи паралелі мають різну кількість годин. Якщо має бути однаково — впишіть правильне число (запишеться в усі класи). Якщо різниця правильна (напр. профільний клас) — «лишити як є»."' : ''}>

function planTotals() {
  const C = cls();
  let allH = 0, allG = 0;
  for (const s of S.subjects) {
    const td = $(`[data-rt="${s.id}"]`);
    if (td) td.textContent = fmtZ(C.reduce((a, c) => a + hoursOf(c, s) * groupsOf(c, s), 0));
  }
  for (const c of C) {
    const h = S.subjects.reduce((a, s) => a + hoursOf(c, s), 0), g = S.subjects.reduce((a, s) => a + hoursOf(c, s) * groupsOf(c, s), 0);
    allH += h; allG += g;
    const a = $(`[data-ct="${c.id}"]`), b = $(`[data-cg="${c.id}"]`);
    if (a) a.textContent = fmtZ(h);
    if (b) b.textContent = fmtZ(g);
  }
  const a = $('[data-ct="all"]'), b = $('[data-cg="all"]');
  if (a) a.textContent = fmtZ(allH);
  if (b) b.textContent = fmtZ(allG);
}

/* ---------- Дані і копії ---------- */
V.settings = () => pageHead('Дані і копії', 'Усе зберігається на цьому комп’ютері автоматично. Тут — дані школи, резервні копії та відновлення.') + `
<div class="cols2">
  <section class="card"><header><h2>Школа</h2></header>
    <label class="field">Назва школи<input data-f="set.school" value="${esc(S.school)}" placeholder="напр. Ільницький ЗЗСО І-ІІІ ст."></label>
    <div class="row"><label class="field">Навчальний рік<input data-f="set.year" value="${esc(S.year)}"></label><label class="field">Ставка, год/тиж<input type="number" min="1" data-f="set.stavka" value="${S.stavka}"></label></div>
    <label class="field">Ділити на групи від, учнів<input type="number" min="1" data-f="set.splitMin" value="${S.splitMin}"></label>
    <p class="hint">Поріг діє, коли груп не видно з журналів. Якщо в журналах різні діти — групи визначаються за ними.</p>
  </section>
  <section class="card"><header><h2>Копія файлом</h2></header>
    <p>Файл з усіма даними. Його можна переслати (пошта, Telegram, флешка), відкрити на іншому ПК або відновити з нього дані.</p>
    <div class="row"><button class="btn primary" data-act="backup">${ic('download')} Завантажити копію</button><button class="btn" data-act="openJson">${ic('restore')} Відновити з файлу…</button></div>
    ${lastExport ? `<p class="hint">Остання копія файлом: ${new Date(lastExport).toLocaleDateString('uk-UA')}.</p>` : ''}
  </section>
  <section class="card"><header><h2>Автокопії в папку</h2>${DIR && dirOk ? `<span class="pill ok">${ic('check')} працює</span>` : ''}</header>
    ${!canDir ? '<p class="muted">Доступно лише в Chrome або Edge.</p>' : DIR ? `<p>Папка «<b>${esc(DIR.name)}</b>». Там файл «Навантаження — поточні дані.json» і підпапка «Копії по днях».</p>
      <div class="row">${dirOk ? '' : `<button class="btn warn" data-act="reconnectDir">Дозволити запис</button>`}<button class="btn" data-act="pickDir">${ic('folder')} Інша папка…</button><button class="btn ghost" data-act="forgetDir">Вимкнути</button></div>` :
      `<p>Виберіть папку (напр. «Документи\\Навантаження» або флешку) — програма сама записуватиме туди поточні дані й копію за кожен день.</p><div><button class="btn primary" data-act="pickDir">${ic('folder')} Вибрати папку…</button></div>`}
  </section>
  <section class="card"><header><h2 class="bad">Почати з нуля</h2></header>
    <p class="muted">Видаляє всі класи, план, вчителів і розподіл. Перед цим автоматично створюється точка відновлення.</p>
    <div><button class="btn danger" data-act="reset">${ic('trash')} Очистити всі дані</button></div>
  </section>
</div>
<section class="card"><header><h2>Точки відновлення</h2><span class="sp"></span><button class="btn small" data-act="snapNow">${ic('plus')} Створити зараз</button></header>
  <p class="sub">Створюються самі: при відкритті програми, перед завантаженням з Мрії, перед відновленням і очищенням. Зберігаються останні ${KEEP_SNAPS}.</p>
  <div id="snaps"><p class="muted">Завантаження…</p></div>
</section>`;
async function renderSnaps() {
  const el = $('#snaps'); if (!el) return;
  const all = await listSnaps().catch(() => []);
  const dt = t => new Date(t).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  el.innerHTML = all.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th style="width:170px">Коли</th><th>Причина</th><th>Що всередині</th><th style="width:230px"></th></tr></thead><tbody>` +
    all.map(s => `<tr><td class="num">${dt(s.at)}</td><td>${esc(s.reason)}</td><td class="muted">${esc(s.info)}</td>
      <td style="white-space:nowrap;text-align:right"><button class="btn small" data-act="snapRestore" data-id="${s.id}">${ic('restore')} Відновити</button> <button class="btn small ghost" data-act="snapDownload" data-id="${s.id}">${ic('download')} Файлом</button></td></tr>`).join('') +
    '</tbody></table></div>' : '<p class="muted">Копій ще нема.</p>';
}

/* ---------- дії ---------- */
const ACT = {
  pickXlsx: () => $('#fileXlsx').click(),
  closeImport: () => { lastImport = null; render(); },
  confirmEst: () => {
    let n = 0;
    for (const p of Object.values(S.plan)) if (p.est) { delete p.est; n++; }
    save(); render(); toast(`Підтверджено: ${n}`);
  },
  planAll: el => { planAll = el.dataset.v === '1'; planWarnOnly = false; render(); },
  planWarn: () => { planWarnOnly = !planWarnOnly; render(); },
  planMode: el => { planMode = el.dataset.v; render(); },
  parOk: el => {
    const [g, sid] = el.dataset.k.split('|'), s = byId(S.subjects, sid);
    for (const c of S.classes) if (gradeOf(c.name) === +g && S.plan[c.id + '|' + sid]) delete S.plan[c.id + '|' + sid].est;
    save(); keepScroll(render); toast(`${g} клас, ${s.name}: підтверджено`);
  },
  distOnly: el => { dist.only = el.dataset.v === '1'; render(); },
  addClass: () => {
    const name = normClass($('#newClass').value), n = $('#newCount').value;
    if (!name) return toast('Вкажіть клас');
    if (S.classes.some(c => c.name === name)) return toast('Клас ' + name + ' уже є');
    S.classes.push({ id: uid(), name, students: n === '' ? null : +n, src: 'вручну' });
    save(); render(); $('#newClass')?.focus();
  },
  addClasses: () => {
    const names = $('#bulkClasses').value.split(/[,;\n]+/).map(normClass).filter(Boolean);
    let k = 0;
    for (const name of names) if (!S.classes.some(c => c.name === name)) { S.classes.push({ id: uid(), name, students: null, src: 'вручну' }); k++; }
    save(); render(); toast('Додано класів: ' + k);
  },
  delClass: el => {
    const c = byId(S.classes, el.dataset.id);
    if (!confirm(`Видалити клас ${c.name} разом з його годинами і розподілом?`)) return;
    S.classes = S.classes.filter(x => x !== c);
    for (const m of [S.plan, S.assign]) for (const k in m) if (k.startsWith(c.id + '|')) delete m[k];
    save(); render();
  },
  cycleG: el => {
    const k = el.dataset.k, [cid, sid] = k.split('|'), c = byId(S.classes, cid), s = byId(S.subjects, sid);
    const p = S.plan[k] || (S.plan[k] = {});
    delete p.gi;
    p.g = !p.g ? (autoGroups(c, s) === 1 ? 2 : 1) : p.g >= 3 ? undefined : p.g + 1;
    if (p.g === autoGroups(c, s)) delete p.g;
    const g = groupsOf(c, s);
    el.textContent = g > 1 ? g + ' групи' : 'весь клас';
    el.classList.toggle('on', g > 1); el.classList.toggle('man', !!p.g);
    el.title = `Груп: ${g} (${p.g ? 'задано вручну' : 'автоматично'}). Натисніть, щоб змінити`;
    save(); planTotals(); renderNav();
  },
  copyPlan: () => {
    const from = byId(S.classes, $('#copyFrom').value), to = S.classes.filter(c => c !== from && gradeOf(c.name) === gradeOf(from.name));
    if (!to.length) return toast('У паралелі ' + gradeOf(from.name) + ' інших класів нема');
    if (!confirm(`Скопіювати години ${from.name} в ${to.map(c => c.name).join(', ')}? Наявні години в цих класах буде замінено.`)) return;
    for (const c of to) for (const s of S.subjects) {
      const src = S.plan[from.id + '|' + s.id], k = c.id + '|' + s.id;
      if (src?.h) S.plan[k] = { ...S.plan[k], h: src.h }; else if (S.plan[k]) { delete S.plan[k].h; delete S.plan[k].est; }
      if (S.plan[k]) delete S.plan[k].est;
    }
    save(); render(); toast('Скопійовано');
  },
  addSubj: () => {
    const name = $('#newSubj').value.trim();
    if (!name) return toast('Вкажіть назву предмета');
    S.subjects.push({ id: uid(), name, split: +$('#newSplit').value });
    save(); render();
  },
  subjMove: el => {
    const i = S.subjects.findIndex(s => s.id === el.dataset.id), j = i + +el.dataset.d;
    if (j < 0 || j >= S.subjects.length) return;
    [S.subjects[i], S.subjects[j]] = [S.subjects[j], S.subjects[i]];
    save(); render();
  },
  delSubj: el => {
    const s = byId(S.subjects, el.dataset.id);
    if (!confirm(`Видалити предмет «${s.name}» з планом і розподілом?`)) return;
    S.subjects = S.subjects.filter(x => x !== s);
    for (const m of [S.plan, S.assign]) for (const k in m) if (k.split('|')[1] === s.id) delete m[k];
    save(); render();
  },
  addTeachers: () => {
    const names = $('#newTeachers').value.split('\n').map(x => x.replace(/^\s*\d+[.)]\s*/, '').replace(/\s+/g, ' ').trim()).filter(Boolean);
    let k = 0;
    for (const name of names) if (!S.teachers.some(t => t.name === name)) { S.teachers.push({ id: uid(), name, note: '' }); k++; }
    save(); render(); toast('Додано вчителів: ' + k);
  },
  delTeacher: el => {
    const t = byId(S.teachers, el.dataset.id);
    const has = Object.values(S.assign).includes(t.id) || S.extras.some(e => e.teacherId === t.id);
    if (!confirm(`Видалити ${t.name}?${has ? ' Його години стануть нерозподіленими.' : ''}`)) return;
    S.teachers = S.teachers.filter(x => x !== t);
    for (const k in S.assign) if (S.assign[k] === t.id) delete S.assign[k];
    S.extras = S.extras.filter(e => e.teacherId !== t.id);
    save(); render();
  },
  addExtra: () => {
    const teacherId = $('#exT').value, title = $('#exTitle').value.trim(), h = parseFloat(($('#exH').value || '').replace(',', '.'));
    if (!teacherId || !title || !h) return toast('Вкажіть вчителя, вид роботи і години');
    S.extras.push({ id: uid(), teacherId, title, h });
    save(); render();
  },
  delExtra: el => { S.extras = S.extras.filter(e => e.id !== el.dataset.id); save(); render(); },
  bulkAll: () => {
    const bs = byId(S.subjects, bulk.s), ids = cls().filter(c => hoursOf(c, bs)).map(c => c.id);
    const allOn = ids.every(id => bulk.cls.has(id));
    bulk.cls = new Set(allOn ? [] : ids); render();
  },
  bulkAssign: () => {
    if (!bulk.t) return toast('Виберіть вчителя');
    if (!bulk.cls.size) return toast('Позначте класи');
    let k = 0;
    for (const u of units()) {
      if (u.s.id !== bulk.s || !bulk.cls.has(u.c.id)) continue;
      if (bulk.grp === 'free' && u.t) continue;
      if ((bulk.grp === '0' || bulk.grp === '1') && u.i !== +bulk.grp) continue;
      S.assign[u.key] = bulk.t; k++;
    }
    bulk.cls.clear(); save(); render(); toast(k ? 'Призначено: ' + k : 'Нічого не змінено — перевірте вибір груп');
  },
  exportXlsx,
  print: () => print(),
  openJson: () => $('#fileJson').click(),
  backup: async () => {
    download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), `Навантаження ${S.school ? S.school + ' ' : ''}копія ${today()}.json`);
    lastExport = Date.now(); await kvPut('lastExport', lastExport).catch(() => {}); showBanner();
  },
  snooze: async () => { snoozeUntil = Date.now() + DAY; await kvPut('snooze', snoozeUntil).catch(() => {}); showBanner(); },
  pickDir: async () => {
    try {
      const h = await showDirectoryPicker({ id: 'navantazhennya', mode: 'readwrite', startIn: 'documents' });
      DIR = h; dirOk = true; await kvPut('dir', h); await writeFolder(); render(); toast('Копії записуються в папку «' + h.name + '»');
    } catch (e) { if (e.name !== 'AbortError') toast('Не вдалося вибрати папку'); }
  },
  reconnectDir: async () => {
    try { dirOk = await DIR.requestPermission({ mode: 'readwrite' }) === 'granted'; if (dirOk) await writeFolder(); render(); }
    catch (e) { toast('Папка недоступна — виберіть її знову'); }
  },
  forgetDir: async () => { DIR = null; dirOk = false; await kvDel('dir'); render(); },
  snapNow: async () => { await snapshot('вручну'); renderSnaps(); toast('Точку відновлення створено'); },
  snapRestore: async el => {
    const s = (await listSnaps()).find(x => x.id === +el.dataset.id);
    if (!s || !confirm(`Відновити дані станом на ${new Date(s.at).toLocaleString('uk-UA')} (${s.info})?\n\nПоточні дані спершу збережуться в копію.`)) return;
    await takeData(s.data, 'копія від ' + new Date(s.at).toLocaleString('uk-UA')); render();
  },
  snapDownload: async el => {
    const s = (await listSnaps()).find(x => x.id === +el.dataset.id);
    if (s) download(new Blob([JSON.stringify(s.data, null, 1)], { type: 'application/json' }), `Навантаження копія ${new Date(s.at).toISOString().slice(0, 16).replace(/[T:]/g, '-')}.json`);
  },
  reset: async () => {
    if (prompt('Щоб видалити всі дані, напишіть ТАК') !== 'ТАК') return;
    await snapshot('перед очищенням');
    S = blank(); lastImport = null; await flush(); go('help');
  }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) return go(tab.dataset.tab);
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.drop')) ACT.pickXlsx();
  if (e.key === 'Enter' && e.target.id === 'newClass') ACT.addClass();
  if (e.key === 'Enter' && e.target.id === 'newCount') ACT.addClass();
  if (e.key === 'Enter' && e.target.id === 'newSubj') ACT.addSubj();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.plan) return;
  const k = el.dataset.plan, v = parseFloat(String(el.value).replace(',', '.'));
  if (v > 0) { S.plan[k] = { ...S.plan[k], h: v }; delete S.plan[k].est; }
  else if (S.plan[k]) { delete S.plan[k].h; delete S.plan[k].est; if (!S.plan[k].g) delete S.plan[k]; }
  el.parentElement.classList.remove('est1', 'est2'); el.parentElement.removeAttribute('title');
  const b = el.nextElementSibling; if (b) b.style.visibility = v > 0 ? 'visible' : 'hidden';
  save(); planTotals(); renderNav();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.par) {
    /* паралель: одне число для всіх класів паралелі */
    const [g, sid] = el.dataset.par.split('|'), v = parseFloat(String(el.value).replace(',', '.'));
    for (const c of S.classes) {
      if (gradeOf(c.name) !== +g) continue;
      const k = c.id + '|' + sid;
      if (v > 0) { S.plan[k] = { ...S.plan[k], h: v }; delete S.plan[k].est; }
      else if (S.plan[k]) { delete S.plan[k].h; delete S.plan[k].est; if (!S.plan[k].g) delete S.plan[k]; }
    }
    save(); keepScroll(render);
    return;
  }
  const f = el.dataset.f; if (!f) return;
  const id = el.dataset.id, v = el.value, num = v === '' ? null : Math.max(0, +v);
  let redraw = false;
  switch (f) {
    case 'class.name': {
      const c = byId(S.classes, id), n = normClass(v);
      if (!n || S.classes.some(x => x !== c && x.name === n)) { el.value = c.name; return toast('Такий клас уже є'); }
      c.name = n; el.value = n; break;
    }
    case 'class.students': byId(S.classes, id).students = num; redraw = true; break;
    case 'class.boys': byId(S.classes, id).boys = num; break;
    case 'class.girls': byId(S.classes, id).girls = num; break;
    case 'subj.name': if (v.trim()) byId(S.subjects, id).name = v.trim(); break;
    case 'subj.split': byId(S.subjects, id).split = +v; redraw = true; break;
    case 't.name': if (v.trim()) byId(S.teachers, id).name = v.trim(); break;
    case 't.note': byId(S.teachers, id).note = v.trim(); break;
    case 'ex.title': byId(S.extras, id).title = v.trim(); break;
    case 'ex.h': byId(S.extras, id).h = num || 0; break;
    case 'set.school': S.school = v.trim(); break;
    case 'set.year': S.year = v.trim() || guessYear(); break;
    case 'set.stavka': S.stavka = +v > 0 ? +v : 18; break;
    case 'set.splitMin': S.splitMin = +v > 0 ? +v : 27; break;
    case 'assign': if (v) S.assign[el.dataset.k] = v; else delete S.assign[el.dataset.k]; redraw = true; break;
    case 'bulk.s': bulk.s = v; bulk.cls.clear(); return render();
    case 'bulk.t': bulk.t = v; return;
    case 'bulk.grp': bulk.grp = v; return;
    case 'bulk.c': el.checked ? bulk.cls.add(id) : bulk.cls.delete(id); return;
    case 'dist.cls': dist.cls = v; return render();
  }
  save();
  if (redraw) { const y = scrollY; render(); scrollTo(0, y); }
  else renderNav();
});
$('#fileXlsx').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importFiles(fs); });
$('#fileJson').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openJsonFile(f); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const fs = [...(e.dataTransfer?.files || [])]; if (fs.length) importFiles(fs);
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-bulk]')) bulk.open = e.target.open; }, true);
addEventListener('beforeprint', () => { if (TAB !== 'load') go('load'); });

/* якщо logo.gif у папці нема — лишається стандартний значок */
$('#logoImg').addEventListener('error', e => e.target.remove());

addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
addEventListener('pagehide', () => flush());

(async () => {
  try {
    const d = await kvGet('data');
    if (valid(d)) S = d;
    else {
      /* перенесення з першої версії (дані в localStorage) */
      let old = null; try { old = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
      if (valid(old)) { S = old; await kvPut('data', S); }
    }
    const last = (await listSnaps())[0];
    if (!last || Date.now() - last.at > 30 * 60000) await snapshot('при відкритті');
    lastExport = await kvGet('lastExport') || 0;
    snoozeUntil = await kvGet('snooze') || 0;
    DIR = await kvGet('dir') || null;
    if (DIR) dirOk = await DIR.queryPermission({ mode: 'readwrite' }) === 'granted';
    savedAt = S.updated || 0;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { saveErr = 'База даних недоступна — відкрийте програму в Chrome або Edge'; }
  render();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
