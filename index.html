<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Заборона будь-яких мережевих запитів зі сторінки: дані не можуть бути нікуди відправлені -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="theme-color" content="#2155C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Навантаження школи</title>
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --raise:#F7F8FB; --ink:#161B26; --muted:#5E6677; --line:#DADFE8;
  --accent:#2155C9; --accent-ink:#FFFFFF; --accent-soft:#E2EAFB;
  --ok:#11764E; --ok-soft:#DDF1E7; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#BF3326; --bad-soft:#FBE3E0;
  --display:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --surface:#171C25; --raise:#1D2330; --ink:#E5E9F0; --muted:#98A1B3; --line:#2B3342;
    --accent:#7FA6F5; --accent-ink:#0B1221; --accent-soft:#1D2A45;
    --ok:#5CCB98; --ok-soft:#15302A; --warn:#EDAA45; --warn-soft:#33270F; --bad:#FF7B6E; --bad-soft:#3A1E1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C25; --raise:#1D2330; --ink:#E5E9F0; --muted:#98A1B3; --line:#2B3342;
  --accent:#7FA6F5; --accent-ink:#0B1221; --accent-soft:#1D2A45;
  --ok:#5CCB98; --ok-soft:#15302A; --warn:#EDAA45; --warn-soft:#33270F; --bad:#FF7B6E; --bad-soft:#3A1E1B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}

.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:22px}
.brand #schoolLbl{color:var(--muted)}
#saveState{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
#tabs{display:flex;gap:2px;overflow-x:auto}
#tabs button{border:0;background:none;padding:9px 12px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
#tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
#tabs button b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}

main{max-width:1400px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card > header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > header .sp{flex:1}

.btn{min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:30px;padding:0 10px;font-size:13px}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--bad-soft);color:var(--bad)}

input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;min-height:34px}
textarea{width:100%;min-height:110px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.form label input,.form label select{color:var(--ink);font-weight:400;font-size:14px}
.w4{width:70px}.w6{width:90px}.w12{width:180px}.w20{width:300px}.grow{flex:1 1 220px}

.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 230px)}
table.tbl{border-collapse:collapse;width:100%;background:var(--surface)}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:middle}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--raise);font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl input{min-height:30px;padding:3px 7px}
.tbl tr.unassigned td{background:var(--warn-soft)}
.tbl tbody tr.teacher-first td{border-top:2px solid var(--line)}

/* grid of plan */
.grid th,.grid td{border-right:1px solid var(--line);padding:3px 4px;text-align:center}
.grid thead th{padding:6px 4px}
.grid thead th small,.grid .subj small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.grid .subj{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:210px;padding:4px 10px;font-weight:600}
.grid thead th.subj{z-index:3;background:var(--raise)}
.grid td.pc{min-width:76px;white-space:nowrap}
.grid td.pc input{width:46px;text-align:center;border-color:transparent;background:var(--raise)}
.grid td.pc input:hover{border-color:var(--line)}
.grid td.est input{border:1.5px dashed var(--warn);background:var(--warn-soft)}
.grid .grp{margin-left:2px;border:1px solid var(--line);background:none;border-radius:6px;font-size:11px;padding:1px 4px;color:var(--muted)}
.grid .grp.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:700}
.grid .grp.man{border-style:solid;border-color:var(--accent)}
.grid tfoot td,.grid tfoot th{position:sticky;bottom:0;background:var(--raise);font-weight:700;font-variant-numeric:tabular-nums}
.grid tfoot tr:first-child td,.grid tfoot tr:first-child th{bottom:29px}
.grid td.tot{font-weight:700;font-variant-numeric:tabular-nums}

.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--raise);cursor:pointer}
.drop b{font-size:16px}
.drop span{color:var(--muted)}
body.dragging .drop{border-color:var(--accent);background:var(--accent-soft)}
body.dragging::after{content:"Відпустіть файли, щоб імпортувати";position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(33,85,201,.18);font:600 26px var(--display);color:var(--accent);pointer-events:none}

.notice{border-radius:10px;padding:10px 14px;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.ok{background:var(--ok-soft)}
#banner{max-width:1400px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
#banner .notice{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.notice ul{margin:6px 0 0;padding-left:20px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile b{display:block;font:600 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}

.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.steps li b{font-family:var(--display);font-size:16px}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--raise);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
.chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;align-items:start}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

@media print{
  body{background:#fff;color:#000}
  .top,.noprint,#toast{display:none!important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .tblwrap{max-height:none;overflow:visible;border:0}
  .tbl thead th{position:static}
  .tbl th,.tbl td{border:1px solid #999;padding:3px 6px}
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><h1>Навантаження</h1><span id="schoolLbl"></span><div id="saveState"></div></div>
    <nav id="tabs"></nav>
  </div>
</header>
<div id="banner" hidden></div>
<main id="view"></main>
<div id="toast" role="status"></div>
<input type="file" id="fileXlsx" multiple accept=".xlsx,.zip" hidden>
<input type="file" id="fileJson" accept=".json" hidden>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const byId = (arr, id) => arr.find(x => x.id === id);
const fmt = n => String(Math.round((+n || 0) * 100) / 100).replace('.', ',');
const fmtZ = n => n ? fmt(n) : '';
const hm = t => new Date(t).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
const today = () => new Date().toISOString().slice(0, 10);

/* окремі ключі — не перетинаються з журналом ФК */
const LS = 'shkola-navantazhennya-v1';

/* split: 0 — без поділу, 1 — ділиться при наповнюваності ≥ порогу, 2 — ділиться лише в 10–11 класах */
const SUBJECTS = [
  ['Українська мова', 0], ['Українська література', 0], ['Зарубіжна література', 0],
  ['Англійська мова', 1], ['Друга іноземна мова', 1],
  ['Математика', 0], ['Алгебра', 0], ['Геометрія', 0],
  ['Історія України', 0], ['Всесвітня історія', 0], ['Громадянська освіта', 0], ['Географія', 0],
  ['Пізнаємо природу', 0], ['Біологія', 0], ['Фізика', 0], ['Хімія', 0],
  ['Інформатика', 1], ['Технології', 1], ['Мистецтво', 0],
  ['Здоров’я, безпека та добробут', 0], ['Фізична культура', 2], ['Захист України', 0]
];
const SPLIT = ['Без поділу', 'Ділиться (≥ поріг учнів)', 'Ділиться лише в 10–11 кл.'];

function guessYear() { const d = new Date(), y = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; return y + '/' + (y + 1); }
function blank() {
  return { v: 1, school: '', year: guessYear(), stavka: 18, splitMin: 27, classes: [],
    subjects: SUBJECTS.map(([name, split]) => ({ id: uid(), name, split })),
    teachers: [], plan: {}, assign: {}, extras: [], updated: 0 };
}
function valid(d) { return d && d.v === 1 && Array.isArray(d.classes) && Array.isArray(d.subjects) && Array.isArray(d.teachers); }

let S = blank();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- база даних (IndexedDB) + автоматичні копії ---------- */
const DB_NAME = 'navantazhennya-db', KEEP_SNAPS = 60;
let dbp, saveT, savedAt = 0, saveErr = '';
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('snaps', { keyPath: 'id', autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode), r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = key => tx('kv', 'readonly', st => st.get(key));
const kvPut = (key, val) => tx('kv', 'readwrite', st => st.put(val, key));
const kvDel = key => tx('kv', 'readwrite', st => st.delete(key));

function save() {
  S.updated = Date.now();
  clearTimeout(saveT); saveT = setTimeout(flush, 300);
}
async function flush() {
  clearTimeout(saveT);
  try { await kvPut('data', S); savedAt = Date.now(); saveErr = ''; }
  catch (e) { saveErr = 'Не вдалося зберегти!'; }
  showSave(); folderSave();
}
const summary = d => `${d.classes.length} кл., ${d.teachers.length} вчит., ${Object.keys(d.assign).length} призначень`;
async function snapshot(reason) {
  if (!S.classes.length && !S.teachers.length) return;
  await tx('snaps', 'readwrite', st => st.add({ at: Date.now(), reason, info: summary(S), data: JSON.parse(JSON.stringify(S)) }));
  const all = await listSnaps();
  if (all.length > KEEP_SNAPS) await tx('snaps', 'readwrite', st => all.slice(KEEP_SNAPS).forEach(s => st.delete(s.id)));
}
async function listSnaps() {
  const all = await tx('snaps', 'readonly', st => st.getAll());
  return all.sort((a, b) => b.at - a.at);
}

/* копії в папку на диску (Chrome / Edge) */
const canDir = 'showDirectoryPicker' in window;
let DIR = null, dirOk = false, dirAt = 0, dirT;
function folderSave() { clearTimeout(dirT); dirT = setTimeout(writeFolder, 2000); }
async function writeFolder() {
  if (!DIR || !dirOk || (!S.classes.length && !S.teachers.length)) return;
  try {
    const put = async (dir, name) => { const w = await (await dir.getFileHandle(name, { create: true })).createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close(); };
    await put(DIR, 'Навантаження — поточні дані.json');
    const sub = await DIR.getDirectoryHandle('Копії по днях', { create: true });
    await put(sub, `Навантаження ${today()}.json`);
    dirAt = Date.now();
  } catch (e) { dirOk = false; }
  showSave();
}
function showSave() {
  const el = $('#saveState'); if (!el) return;
  let h = saveErr ? `<span class="bad">● ${saveErr}</span>` : `<span class="ok">● Збережено${savedAt ? ' о ' + hm(savedAt) : ''}</span>`;
  if (DIR && dirOk) h += ` <span class="muted">· копія в папці «${esc(DIR.name)}»${dirAt ? ' о ' + hm(dirAt) : ''}</span>`;
  else if (DIR) h += ` <button class="btn small warn" data-act="reconnectDir">Дозволити копії в папку «${esc(DIR.name)}»</button>`;
  el.innerHTML = h;
  showBanner();
}
async function takeData(d, from) {
  if (!valid(d)) { toast('Це не файл програми «Навантаження»'); return false; }
  await snapshot('перед відновленням');
  S = d; await flush();
  toast('Відновлено: ' + from); return true;
}

/* ---------- класи, предмети, години ---------- */
const LAT = { A: 'А', B: 'В', C: 'С', E: 'Е', H: 'Н', I: 'І', K: 'К', M: 'М', O: 'О', P: 'Р', T: 'Т', X: 'Х' };
function normClass(v) {
  let s = String(v || '').trim().toUpperCase().replace(/\s+/g, '').replace(/[ABCEHIKMOPTX]/g, c => LAT[c]);
  const m = s.match(/^(\d{1,2})[-–—.]?([А-ЯҐЄІЇ])(?:КЛАС|КЛ\.?)?$/);
  return m ? m[1] + '-' + m[2] : s.replace(/КЛАС$/, '');
}
const gradeOf = n => parseInt(n, 10) || 0;
const cls = () => [...S.classes].sort((a, b) => gradeOf(a.name) - gradeOf(b.name) || a.name.localeCompare(b.name, 'uk'));
const teachersSorted = () => [...S.teachers].sort((a, b) => a.name.localeCompare(b.name, 'uk'));
const cellOf = (c, s) => S.plan[c.id + '|' + s.id];
const hoursOf = (c, s) => +(cellOf(c, s)?.h) || 0;
function autoGroups(c, s) {
  if (!s.split || (s.split === 2 && gradeOf(c.name) < 10)) return 1;
  return (c.students || 0) >= S.splitMin ? 2 : 1;
}
const groupsOf = (c, s) => cellOf(c, s)?.g || autoGroups(c, s);

/* одиниця навантаження = клас × предмет × група */
function units() {
  const out = [];
  for (const c of cls()) for (const s of S.subjects) {
    const h = hoursOf(c, s); if (!h) continue;
    const g = groupsOf(c, s);
    for (let i = 0; i < g; i++) {
      const key = c.id + '|' + s.id + '|' + i, t = S.assign[key];
      out.push({ c, s, i, g, h, key, t: byId(S.teachers, t) ? t : '' });
    }
  }
  return out;
}
function loads() {
  const m = new Map(teachersSorted().map(t => [t.id, { t, rows: [], extra: [], total: 0 }]));
  for (const u of units()) { const L = m.get(u.t); if (L) { L.rows.push(u); L.total += u.h; } }
  for (const e of S.extras) { const L = m.get(e.teacherId); if (L) { L.extra.push(e); L.total += +e.h || 0; } }
  return [...m.values()];
}
function bySubject(L) {
  const m = new Map();
  for (const u of L.rows) {
    if (!m.has(u.s.id)) m.set(u.s.id, { s: u.s, parts: [], h: 0 });
    const x = m.get(u.s.id);
    x.parts.push({ u, label: u.c.name + (u.g > 1 ? ' гр.' + (u.i + 1) : '') });
    x.h += u.h;
  }
  return [...m.values()];
}
function status(total) {
  const st = S.stavka;
  if (!total) return ['без годин', ''];
  if (total < st) return ['менше ставки', 'warn'];
  if (total === st) return ['ставка', 'ok'];
  return ['понад ставку', 'bad'];
}
function guessSplit(name) {
  if (/англ|німец|франц|іспан|польськ|іноземн|інформат|технолог|трудов/i.test(name)) return 1;
  if (/фізичн.*культ/i.test(name)) return 2;
  return 0;
}
const normSubj = s => String(s).toLowerCase().replace(/[’'`ʼ]/g, '').replace(/\s+/g, ' ').trim();
function findSubject(name) {
  const n = normSubj(name);
  return S.subjects.find(s => normSubj(s.name) === n) || S.subjects.find(s => { const x = normSubj(s.name); return x.includes(n) || n.includes(x); });
}

/* ---------- читання .xlsx з Мрії (без інтернету) ---------- */
function unzip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('файл пошкоджений або це не .xlsx');
  const n = dv.getUint16(e + 10, true), files = {};
  let p = dv.getUint32(e + 16, true);
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));

      msgs.push(`<b>${lastExport ? `Копії файлом не було ${Math.floor((Date.now() - lastExport) / DAY)} дн.` : 'Ще не було жодної копії файлом.'}</b> Збережіть і перешліть її (пошта, Telegram, флешка). <button class="btn small primary" data-act="backup">Завантажити копію</button> <button class="btn small" data-act="snooze">Нагадати завтра</button>`);
  }

}

function planTotals() {
  const C = cls();
  let allH = 0, allG = 0;
  for (const s of S.subjects) {
    const td = $(`[data-rt="${s.id}"]`);
    if (td) td.textContent = fmtZ(C.reduce((a, c) => a + hoursOf(c, s) * groupsOf(c, s), 0));
  }
  for (const c of C) {
    const h = S.subjects.reduce((a, s) => a + hoursOf(c, s), 0), g = S.subjects.reduce((a, s) => a + hoursOf(c, s) * groupsOf(c, s), 0);
    allH += h; allG += g;
    const a = $(`[data-ct="${c.id}"]`), b = $(`[data-cg="${c.id}"]`);
    if (a) a.textContent = fmtZ(h);
    if (b) b.textContent = fmtZ(g);
  }
  const a = $('[data-ct="all"]'), b = $('[data-cg="all"]');
  if (a) a.textContent = fmtZ(allH);
  if (b) b.textContent = fmtZ(allG);
}

  const all = U.reduce((a, u) => a + u.h, 0), free = U.filter(u => !u.t), freeH = free.reduce((a, u) => a + u.h, 0);
  const extraH = S.extras.reduce((a, e) => a + (+e.h || 0), 0);
  let n = 0;
  const body = L.map(x => {
    const subs = bySubject(x), lines = [...subs.map(s => [esc(s.s.name), s.parts.map(p => `${esc(p.label)}&nbsp;(${fmt(p.u.h)})`).join(', '), s.h]), ...x.extra.map(e => [esc(e.title), '<span class="muted">додатково</span>', +e.h || 0])];
    if (!lines.length) lines.push(['<span class="muted">—</span>', '', 0]);
    const [st, cl] = status(x.total), span = lines.length;
    n++;
    return lines.map((l, i) => `<tr${i ? '' : ' class="teacher-first"'}>` +
      (i ? '' : `<td rowspan="${span}" class="num">${n}</td><td rowspan="${span}"><b>${esc(x.t.name)}</b>${x.t.note ? `<br><span class="muted">${esc(x.t.note)}</span>` : ''}</td>`) +
      `<td>${l[0]}</td><td>${l[1]}</td><td class="num">${fmtZ(l[2])}</td>` +
      (i ? '' : `<td rowspan="${span}" class="num"><b>${fmt(x.total)}</b></td><td rowspan="${span}" class="num">${fmt(x.total / S.stavka)}</td><td rowspan="${span}"><span class="pill ${cl}">${st}</span></td>`) + '</tr>').join('');
  }).join('');
  return `
<div class="tiles">
  <div class="tile"><span>Годин за планом (з групами)</span><b>${fmt(all)}</b></div>
  <div class="tile"><span>Розподілено</span><b class="${freeH ? '' : 'ok'}">${fmt(all - freeH)}</b></div>
  <div class="tile"><span>Не розподілено</span><b class="${freeH ? 'bad' : ''}">${fmt(freeH)}</b></div>
  <div class="tile"><span>Додаткові години</span><b>${fmt(extraH)}</b></div>
  <div class="tile"><span>Вчителів</span><b>${S.teachers.length}</b></div>
  <div class="tile"><span>Ставок разом</span><b>${fmt((all - freeH + extraH) / S.stavka)}</b></div>
</div>
<section class="card">
  <header><h2>Навантаження вчителів${S.school ? ' — ' + esc(S.school) : ''}, ${esc(S.year)} н. р.</h2><span class="sp"></span>
    <div class="form noprint"><button class="btn primary" data-act="exportXlsx">Експорт в Excel</button><button class="btn" data-act="print">Друк</button></div></header>
  <div class="tblwrap"><table class="tbl"><thead><tr><th class="num">№</th><th>Вчитель</th><th>Предмет</th><th>Класи (годин)</th><th class="num">Годин</th><th class="num">Разом</th><th class="num">Ставок</th><th>Стан</th></tr></thead>
  <tbody>${body}</tbody></table></div>
  <p class="muted">Ставка = ${S.stavka} год на тиждень.</p>
</section>
${free.length ? `<section class="card"><header><h3 class="bad">Не розподілено: ${fmt(freeH)} год</h3><span class="sp"></span><button class="btn small noprint" data-go="dist">До розподілу</button></header>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Клас</th><th>Предмет</th><th>Група</th><th class="num">Годин</th></tr></thead><tbody>` +
  free.map(u => `<tr><td>${esc(u.c.name)}</td><td>${esc(u.s.name)}</td><td>${u.g > 1 ? u.i + 1 : ''}</td><td class="num">${fmt(u.h)}</td></tr>`).join('') + '</tbody></table></div></section>' : ''}`;
};

V.settings = () => `
<section class="card">
  <header><h2>Налаштування</h2></header>
  <div class="form">
    <label>Назва школи<input class="w20" data-f="set.school" value="${esc(S.school)}" placeholder="Напр.: Ліцей № 1"></label>

</section>
<section class="card">

    `<p>Виберіть папку (наприклад, «Документи\\Навантаження» або флешку) — програма сама записуватиме туди поточні дані й окрему копію за кожен день.</p><div><button class="btn primary" data-act="pickDir">Вибрати папку для копій…</button></div>`}
</section>
<section class="card">
  <header><h3>Точки відновлення</h3><span class="sp"></span><button class="btn small" data-act="snapNow">Створити зараз</button></header>
  <p class="muted">Зберігаються всередині програми автоматично: при кожному відкритті, перед імпортом з Мрії, перед відновленням і очищенням. Останні ${KEEP_SNAPS}.</p>

  <div><button class="btn danger" data-act="reset">Очистити всі дані</button></div>

async function renderSnaps() {
  const el = $('#snaps'); if (!el) return;
  const all = await listSnaps().catch(() => []);
  const dt = t => new Date(t).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  el.innerHTML = all.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Коли</th><th>Причина</th><th>Що всередині</th><th></th></tr></thead><tbody>` +
    all.map(s => `<tr><td class="num" style="text-align:left">${dt(s.at)}</td><td>${esc(s.reason)}</td><td class="muted">${esc(s.info)}</td>
      <td style="white-space:nowrap"><button class="btn small" data-act="snapRestore" data-id="${s.id}">Відновити</button> <button class="btn small" data-act="snapDownload" data-id="${s.id}">Файлом</button></td></tr>`).join('') +
    '</tbody></table></div>' : '<p class="muted">Копій ще нема.</p>';
}

/* ---------- дії ---------- */
const ACT = {
  pickXlsx: () => $('#fileXlsx').click(),
  closeImport: () => { lastImport = null; render(); },
  addClass: () => {
    const name = normClass($('#newClass').value), n = $('#newCount').value;
    if (!name) return toast('Вкажіть клас');
    if (S.classes.some(c => c.name === name)) return toast('Клас ' + name + ' уже є');
    S.classes.push({ id: uid(), name, students: n === '' ? null : +n, src: 'вручну' });
    save(); render(); $('#newClass')?.focus();
  },
  addClasses: () => {
    const names = $('#bulkClasses').value.split(/[,;\n]+/).map(normClass).filter(Boolean);
    let k = 0;
    for (const name of names) if (!S.classes.some(c => c.name === name)) { S.classes.push({ id: uid(), name, students: null, src: 'вручну' }); k++; }
    save(); render(); toast('Додано класів: ' + k);
  },
  delClass: el => {
    const c = byId(S.classes, el.dataset.id);
    if (!confirm(`Видалити клас ${c.name} разом з його годинами і розподілом?`)) return;
    S.classes = S.classes.filter(x => x !== c);
    for (const m of [S.plan, S.assign]) for (const k in m) if (k.startsWith(c.id + '|')) delete m[k];
    save(); render();
  },
  cycleG: el => {
    const k = el.dataset.k, [cid, sid] = k.split('|'), c = byId(S.classes, cid), s = byId(S.subjects, sid);
    const p = S.plan[k] || (S.plan[k] = {});
    p.g = !p.g ? (autoGroups(c, s) === 1 ? 2 : 1) : p.g >= 3 ? undefined : p.g + 1;
    if (p.g === autoGroups(c, s)) delete p.g;
    const g = groupsOf(c, s);
    el.textContent = g + 'гр';
    el.classList.toggle('on', g > 1); el.classList.toggle('man', !!p.g);
    el.title = `Груп: ${g} (${p.g ? 'вручну' : 'автоматично'}). Натисніть, щоб змінити`;
    save(); planTotals();
  },
  copyPlan: () => {
    const from = byId(S.classes, $('#copyFrom').value), to = S.classes.filter(c => c !== from && gradeOf(c.name) === gradeOf(from.name));
    if (!to.length) return toast('У паралелі ' + gradeOf(from.name) + ' інших класів нема');
    if (!confirm(`Скопіювати години ${from.name} в ${to.map(c => c.name).join(', ')}? Наявні години в цих класах буде замінено.`)) return;
    for (const c of to) for (const s of S.subjects) {
      const src = S.plan[from.id + '|' + s.id], k = c.id + '|' + s.id;
      if (src?.h) S.plan[k] = { ...S.plan[k], h: src.h }; else if (S.plan[k]) { delete S.plan[k].h; delete S.plan[k].est; }
      if (S.plan[k]) delete S.plan[k].est;
    }
    save(); render(); toast('Скопійовано');
  },
  addSubj: () => {
    const name = $('#newSubj').value.trim();
    if (!name) return toast('Вкажіть назву предмета');
    S.subjects.push({ id: uid(), name, split: +$('#newSplit').value });
    save(); render();
  },
  subjMove: el => {
    const i = S.subjects.findIndex(s => s.id === el.dataset.id), j = i + +el.dataset.d;
    if (j < 0 || j >= S.subjects.length) return;
    [S.subjects[i], S.subjects[j]] = [S.subjects[j], S.subjects[i]];
    save(); render();
  },
  delSubj: el => {
    const s = byId(S.subjects, el.dataset.id);
    if (!confirm(`Видалити предмет «${s.name}» з планом і розподілом?`)) return;
    S.subjects = S.subjects.filter(x => x !== s);
    for (const m of [S.plan, S.assign]) for (const k in m) if (k.split('|')[1] === s.id) delete m[k];
    save(); render();
  },
  addTeachers: () => {
    const names = $('#newTeachers').value.split('\n').map(x => x.replace(/^\s*\d+[.)]\s*/, '').replace(/\s+/g, ' ').trim()).filter(Boolean);
    let k = 0;
    for (const name of names) if (!S.teachers.some(t => t.name === name)) { S.teachers.push({ id: uid(), name, note: '' }); k++; }
    save(); render(); toast('Додано вчителів: ' + k);
  },
  delTeacher: el => {
    const t = byId(S.teachers, el.dataset.id);
    const has = Object.values(S.assign).includes(t.id) || S.extras.some(e => e.teacherId === t.id);
    if (!confirm(`Видалити ${t.name}?${has ? ' Його години стануть нерозподіленими.' : ''}`)) return;
    S.teachers = S.teachers.filter(x => x !== t);
    for (const k in S.assign) if (S.assign[k] === t.id) delete S.assign[k];
    S.extras = S.extras.filter(e => e.teacherId !== t.id);
    save(); render();
  },
  addExtra: () => {
    const teacherId = $('#exT').value, title = $('#exTitle').value.trim(), h = parseFloat(($('#exH').value || '').replace(',', '.'));
    if (!teacherId || !title || !h) return toast('Вкажіть вчителя, вид роботи і години');
    S.extras.push({ id: uid(), teacherId, title, h });
    save(); render();
  },
  delExtra: el => { S.extras = S.extras.filter(e => e.id !== el.dataset.id); save(); render(); },
  bulkAll: () => {
    const bs = byId(S.subjects, bulk.s), ids = cls().filter(c => hoursOf(c, bs)).map(c => c.id);
    const allOn = ids.every(id => bulk.cls.has(id));
    bulk.cls = new Set(allOn ? [] : ids); render();
  },
  bulkAssign: () => {
    if (!bulk.t) return toast('Виберіть вчителя');
    if (!bulk.cls.size) return toast('Позначте класи');
    let k = 0;
    for (const u of units()) {
      if (u.s.id !== bulk.s || !bulk.cls.has(u.c.id)) continue;
      if (bulk.grp === 'free' && u.t) continue;
      if ((bulk.grp === '0' || bulk.grp === '1') && u.i !== +bulk.grp) continue;
      S.assign[u.key] = bulk.t; k++;
    }
    bulk.cls.clear(); save(); render(); toast(k ? 'Призначено: ' + k : 'Нічого не змінено — перевірте вибір груп');
  },
  exportXlsx,
  print: () => print(),
  openJson: () => $('#fileJson').click(),
  backup: async () => {
    download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), `Навантаження ${S.school ? S.school + ' ' : ''}копія ${today()}.json`);
    lastExport = Date.now(); await kvPut('lastExport', lastExport).catch(() => {}); showBanner();
  },
  snooze: async () => { snoozeUntil = Date.now() + DAY; await kvPut('snooze', snoozeUntil).catch(() => {}); showBanner(); },
  pickDir: async () => {
    try {
      const h = await showDirectoryPicker({ id: 'navantazhennya', mode: 'readwrite', startIn: 'documents' });
      DIR = h; dirOk = true; await kvPut('dir', h); await writeFolder(); render(); toast('Копії записуються в папку «' + h.name + '»');
    } catch (e) { if (e.name !== 'AbortError') toast('Не вдалося вибрати папку'); }
  },
  reconnectDir: async () => {
    try { dirOk = await DIR.requestPermission({ mode: 'readwrite' }) === 'granted'; if (dirOk) await writeFolder(); render(); }
    catch (e) { toast('Папка недоступна — виберіть її знову'); }
  },
  forgetDir: async () => { DIR = null; dirOk = false; await kvDel('dir'); render(); },
  snapNow: async () => { await snapshot('вручну'); renderSnaps(); toast('Точку відновлення створено'); },
  snapRestore: async el => {
    const s = (await listSnaps()).find(x => x.id === +el.dataset.id);
    if (!s || !confirm(`Відновити дані станом на ${new Date(s.at).toLocaleString('uk-UA')} (${s.info})?\n\nПоточні дані спершу збережуться в копію.`)) return;
    await takeData(s.data, 'копія від ' + new Date(s.at).toLocaleString('uk-UA')); render();
  },
  snapDownload: async el => {
    const s = (await listSnaps()).find(x => x.id === +el.dataset.id);
    if (s) download(new Blob([JSON.stringify(s.data, null, 1)], { type: 'application/json' }), `Навантаження копія ${new Date(s.at).toISOString().slice(0, 16).replace(/[T:]/g, '-')}.json`);
  },
  reset: async () => {
    if (prompt('Щоб видалити всі дані, напишіть ТАК') !== 'ТАК') return;
    await snapshot('перед очищенням');
    S = blank(); lastImport = null; await flush(); go('help');
  }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) return go(tab.dataset.tab);
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.drop')) ACT.pickXlsx();
  if (e.key === 'Enter' && e.target.id === 'newClass') ACT.addClass();
  if (e.key === 'Enter' && e.target.id === 'newCount') ACT.addClass();
  if (e.key === 'Enter' && e.target.id === 'newSubj') ACT.addSubj();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.plan) return;
  const k = el.dataset.plan, v = parseFloat(String(el.value).replace(',', '.'));
  if (v > 0) { S.plan[k] = { ...S.plan[k], h: v }; delete S.plan[k].est; }
  else if (S.plan[k]) { delete S.plan[k].h; delete S.plan[k].est; if (!S.plan[k].g) delete S.plan[k]; }
  el.parentElement.classList.remove('est'); el.parentElement.removeAttribute('title');
  const b = el.nextElementSibling; if (b) b.hidden = !(v > 0);
  save(); planTotals();
});
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f; if (!f) return;
  const id = el.dataset.id, v = el.value, num = v === '' ? null : Math.max(0, +v);
  let redraw = false;
  switch (f) {
    case 'class.name': {
      const c = byId(S.classes, id), n = normClass(v);
      if (!n || S.classes.some(x => x !== c && x.name === n)) { el.value = c.name; return toast('Такий клас уже є'); }
      c.name = n; el.value = n; break;
    }
    case 'class.students': byId(S.classes, id).students = num; redraw = true; break;
    case 'class.boys': byId(S.classes, id).boys = num; break;
    case 'class.girls': byId(S.classes, id).girls = num; break;
    case 'subj.name': if (v.trim()) byId(S.subjects, id).name = v.trim(); break;
    case 'subj.split': byId(S.subjects, id).split = +v; redraw = true; break;
    case 't.name': if (v.trim()) byId(S.teachers, id).name = v.trim(); break;
    case 't.note': byId(S.teachers, id).note = v.trim(); break;
    case 'ex.title': byId(S.extras, id).title = v.trim(); break;
    case 'ex.h': byId(S.extras, id).h = num || 0; break;
    case 'set.school': S.school = v.trim(); break;
    case 'set.year': S.year = v.trim() || guessYear(); break;
    case 'set.stavka': S.stavka = +v > 0 ? +v : 18; break;
    case 'set.splitMin': S.splitMin = +v > 0 ? +v : 27; break;
    case 'assign': if (v) S.assign[el.dataset.k] = v; else delete S.assign[el.dataset.k]; redraw = true; break;
    case 'bulk.s': bulk.s = v; bulk.cls.clear(); return render();
    case 'bulk.t': bulk.t = v; return;
    case 'bulk.grp': bulk.grp = v; return;
    case 'bulk.c': el.checked ? bulk.cls.add(id) : bulk.cls.delete(id); return;
    case 'dist.cls': dist.cls = v; return render();
    case 'dist.only': dist.only = el.checked; return render();
  }
  save();
  if (redraw) { const y = scrollY; render(); scrollTo(0, y); }
  else $('#schoolLbl').textContent = [S.school, S.year + ' н. р.'].filter(Boolean).join(' · ');
});
$('#fileXlsx').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importFiles(fs); });
$('#fileJson').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openJsonFile(f); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const fs = [...(e.dataTransfer?.files || [])]; if (fs.length) importFiles(fs);
});
addEventListener('beforeprint', () => { if (TAB !== 'load') go('load'); });

addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
addEventListener('pagehide', () => flush());

(async () => {
  try {
    const d = await kvGet('data');
    if (valid(d)) S = d;
    else {
      /* перенесення з першої версії (дані в localStorage) */
      let old = null; try { old = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
      if (valid(old)) { S = old; await kvPut('data', S); }
    }
    const last = (await listSnaps())[0];
    if (!last || Date.now() - last.at > 30 * 60000) await snapshot('при відкритті');
    lastExport = await kvGet('lastExport') || 0;
    snoozeUntil = await kvGet('snooze') || 0;
    DIR = await kvGet('dir') || null;
    if (DIR) dirOk = await DIR.queryPermission({ mode: 'readwrite' }) === 'granted';
    savedAt = S.updated || 0;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { saveErr = 'База даних недоступна — відкрийте програму в Chrome або Edge'; }
  render();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
